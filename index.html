function loop(n){const dt=Math.min((n-last)/1000,.1);last=n;if(play){pos+=dt;if(pos>=D&&!rec){pos=D;play=false}}
const c=render(toV(pos));
if(voiceReady&&c!==lastC)speakScene(c);
lastC=c;syncAu();
$('s').value=pos/D*1000;$('tm').textContent=`${Math.floor(pos/60)}:${String(Math.floor(pos%60)).padStart(2,'0')} / ${D}s`;$('pp').textContent=play?'Jeda':'Putar';requestAnimationFrame(loop)}
$('pp').onclick=()=>{if(pos>=D)pos=0;play=!play};$('rs').onclick=()=>{pos=0;play=true;lastC=-1};
$('s').oninput=e=>{pos=e.target.value/1000*D;lastC=-1};
$('d').onchange=e=>{if(!e.target.value)return;const r=pos/D;DUR=OR.map(o=>o*e.target.value/60);recalc();saveS();pos=r*D};
$('v').onchange=e=>{if(!e.target.checked){if(window.speechSynthesis)speechSynthesis.cancel();voiceReady=false;lastC=-1}else unlockVoice()};
$('vr').oninput=e=>{$('vrv').textContent=Number(e.target.value).toFixed(1)+'×'};
$('fs').onclick=()=>{try{$('w').requestFullscreen()}catch(e){}};
const nm=()=>`Tekan "Scene berikutnya" (atau tombol N) saat narasi ini mulai: ${SN[rec.length]} - "${CP[rec.length]}"`;
function nextMark(){if(!rec)return;rec.push(pos);if(rec.length>=SC.length){const m=rec.concat(Math.max(au.duration||D,pos+2));DUR=m.slice(1).map((v,i)=>Math.max(1,v-m[i]));rec=null;$('nx').hidden=true;recalc();saveS();$('rm').textContent='Selesai. Durasi scene sudah disesuaikan dengan audio. Putar ulang untuk mengecek.';pos=0;play=true;lastC=-1}else $('rm').textContent=nm()}
$('rc').onclick=()=>{if(!au.src){$('rm').textContent='Muat file audio dulu.';return}rec=[0];pos=0;play=true;au.currentTime=0;lastC=-1;$('nx').hidden=false;$('rm').textContent=nm()};
$('nx').onclick=nextMark;addEventListener('keydown',e=>{if(rec&&(e.key=='n'||e.key=='N'))nextMark()});
au.onended=()=>{if(rec){rec=null;$('nx').hidden=true;$('rm').textContent='Perekaman dibatalkan: audio selesai sebelum semua scene ditandai.'}};
$('af').onchange=e=>{const f=e.target.files[0];if(!f)return;if(window.speechSynthesis)speechSynthesis.cancel();voiceReady=false;au.src=URL.createObjectURL(f);au.onloadedmetadata=()=>{$('rm').textContent='Audio dimuat ('+au.duration.toFixed(1)+' detik). Suara bawaan dimatikan. Atur durasi tiap scene di tabel, atau klik Rekam penanda scene.';pos=0;play=true;lastC=-1;au.play().catch(()=>{})}};
$('fit').onclick=()=>{if(au.duration){const f=au.duration/D;DUR=DUR.map(d=>d*f);recalc();saveS()}};
SC.forEach((s,i)=>{const r=$('tb').insertRow();r.innerHTML='<td><button class="jp">'+SN[i]+'</button></td><td><input class="du" type="number" min="1" step="0.1"> detik<br><small class="mu"></small></td><td><input class="ct" type="text"></td>';r.querySelector('.jp').onclick=()=>{pos=S0()[i];lastC=-1};r.querySelector('.du').oninput=e=>{const v=parseFloat(e.target.value);if(v>=1){DUR[i]=v;recalc();saveS()}};const ct=r.querySelector('.ct');ct.value=CP[i];ct.oninput=()=>{CP[i]=ct.value;saveS()}});recalc();
requestAnimationFrame(loop);
</script></body></html>
